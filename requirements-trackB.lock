# TRACK B -- reimplementation environment. Demo app, ablations, dtype experiments.
#
# Modern transformers with the intervention implemented as a custom attention
# function registered into AttentionInterface, dispatching on module.layer_idx
# so layers 2-13 take an eager path (pre-softmax write access) while the other
# 20 layers keep SDPA.
#
#   python3.11 -m venv .venv-B && . .venv-B/bin/activate
#   pip install -r requirements-trackB.lock
#
# Model: llava-hf/llava-1.5-7b-hf (NOT liuhaotian/llava-v1.5-7b -- weight
# identical but a different image-token expansion path; see the equivalence
# test note at the bottom).

# --- torch: DELIBERATELY NOT PINNED -------------------------------------- #
# Measured on Kaggle (2026-10): the host ships torch 2.11.0+cu128 with native
# cubins for sm_75 (T4), sm_80, sm_86, sm_90, sm_100, sm_120. Forcing a
# downgrade would cost ~5 minutes of every session and risks breaking the
# host's CUDA stack for no scientific gain -- the intervention is arithmetic on
# an attention-logit tensor and does not depend on the torch minor version.
#
# What matters instead is that the exact resolved versions are RECORDED. Every
# JSONL record carries torch_version / transformers_version / transformers_path
# (see bench.generate.host_fingerprint), so a run is reproducible after the
# fact even though the environment was not pinned up front.
#
# Floor only. Install nothing if the host already satisfies it.
torch>=2.6
# torchvision is NOT required: LLaVA image preprocessing goes through the
# transformers AutoProcessor (CLIPImageProcessor), not torchvision transforms.

# --- transformers: capability floor, verified against a real install ------ #
# 4.57.6 was checked directly and exposes everything Track B needs:
#   AttentionInterface, AttentionMaskInterface, ALL_ATTENTION_FUNCTIONS,
#   transformers.integrations.sdpa_attention.sdpa_attention_forward,
#   transformers.masking_utils.eager_mask, LlavaForConditionalGeneration
# The attention dispatch is unchanged in 5.17.x, so a range is honest here and
# an exact pin would only fight the host. `scripts/probe_host.py` asserts the
# capabilities rather than the version number, which is the thing that
# actually has to hold.
transformers>=4.57.6,<6
accelerate>=1.10              # not load-bearing: device_map only, no sharding logic
sentencepiece>=0.2.0

numpy>=1.24                  # host ships 2.1.3; torch 2.11 is built against numpy 2
Pillow==10.4.0
tqdm==4.66.5

