# tokenizers: deliberately unpinned. Modern transformers constrains it tightly
# and the resolver picks correctly; freeze it after the first install.
#
# NO bitsandbytes / quantization.

# ------------------------------------------------- precision discipline ------
# This environment runs the dtype experiment, so pin and LOG these at startup.
# TF32 is the trap: on Ampere+ an fp32 matmul with TF32 enabled has a ~10-bit
# mantissa, i.e. roughly fp16 precision in the QK product, which would
# contaminate the fp32 arm into looking like fp16.
#
#   torch.backends.cuda.matmul.allow_tf32 = False          # default False since 1.12
#   torch.backends.cudnn.allow_tf32 = False                # DEFAULT IS TRUE
#   torch.backends.cuda.matmul.allow_fp16_reduced_precision_reduction = False
#   torch.backends.cuda.matmul.allow_bf16_reduced_precision_reduction = False
#   # torch >= 2.9 additionally: torch.backends.cuda.matmul.fp32_precision = "ieee"
#
# Assert `not torch.is_autocast_enabled()` inside the attention function.
#
# ------------------------------------------------- two mandatory assertions --
# 1. Do NOT use output_attentions=True. From transformers ~4.52 onward there is
#    no eager fallback: sdpa_attention_forward returns (output, None) and the
#    recorder yields an EMPTY TUPLE with only a warning_once. Compute the
#    per-head statistics inside the attention function instead. If you do use
#    it, assert len(out.attentions) == 32 after a warm-up forward.
# 2. AttentionMaskInterface.register("fox", eager_mask) is NOT optional. If the
#    name is missing from the mask registry, transformers skips mask creation
#    and passes attention_mask=None -- causality is silently dropped and the
#    model attends to the future while still producing fluent text.
#
# ------------------------------------------- cross-track equivalence test ----
# Before trusting any Track B number: intervention OFF, fixed seed, greedy
# decoding, same 50 prompts through Track A and Track B, assert identical token
# ids. A prompt-template or image-token-expansion mismatch between the two
# LLaVA checkpoints is the most common silent source of a 2-4 point POPE gap in
# reproductions, and it would be mistaken for a Fox effect.
# LLaVA-1.5 template: "USER: <image>\n{question} ASSISTANT:"
